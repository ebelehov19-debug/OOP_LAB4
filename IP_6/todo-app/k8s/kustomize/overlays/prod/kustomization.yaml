apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: todo-prod

resources:
  - ../../base
  - secret.yaml

patches:
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

images:
  - name: todo-backend
    newName: todo-backend
    newTag: latest
  - name: todo-frontend
    newName: todo-frontend
    newTag: latest
